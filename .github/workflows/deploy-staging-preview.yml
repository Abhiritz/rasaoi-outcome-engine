# Deploy dedicated staging site (ROE-016) — NOT rasaoi-delta production
#
# Target: separate Vercel project (rasaoi-i8 / preferred rename rasaoi-staging)
# Triggers: push to experimental/staging branches only.
# Never merges to develop. Never deploys to VERCEL_PROJECT_ID (prod).

name: Deploy staging site

on:
  push:
    branches:
      - feature/ROE-016-experimental-infra
      - staging
  workflow_dispatch:

concurrency:
  group: staging-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

# Same as ci-cd.yml — Vitest imports supabase client at module load.
env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

jobs:
  quality:
    name: Staging quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
      - name: Audit Apify actor critical and high advisories
        run: |
          npm ci --ignore-scripts --prefix scripts/experimental/apify-rasaoi-menu-sync
          npm audit --audit-level=high --prefix scripts/experimental/apify-rasaoi-menu-sync
      - run: test -f .cursor/CONTEXT_PLAN.md
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-staging:
    name: Deploy staging Vercel project
    needs: quality
    if: github.repository == 'Abhiritz/rasaoi-outcome-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://rasaoi-i8.vercel.app
    steps:
      - name: Deploy safety checks
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/staging|refs/heads/feature/ROE-016-experimental-infra) ;;
            *)
              echo "::error::Refusing staging deploy from ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if [ "${GITHUB_REPOSITORY}" != "Abhiritz/rasaoi-outcome-engine" ]; then
            echo "::error::Refusing deploy from ${GITHUB_REPOSITORY}"
            exit 1
          fi
          missing=0
          for secret in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_STAGING_PROJECT_ID \
            STAGING_VITE_SUPABASE_URL STAGING_VITE_SUPABASE_PUBLISHABLE_KEY STAGING_VITE_SUPABASE_PROJECT_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              missing=1
            fi
          done
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::Missing VERCEL_PROJECT_ID (needed to prove staging is not production)"
            missing=1
          elif [ "${VERCEL_STAGING_PROJECT_ID}" = "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_STAGING_PROJECT_ID must not equal VERCEL_PROJECT_ID"
            missing=1
          fi
          exit "$missing"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          STAGING_VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-check critical and high advisories
        run: npm run audit:ci

      - name: Install Vercel CLI
        run: npm install -g vercel@66.5.0

      - name: Deploy to staging project (--prod on staging project only)
        id: deploy
        run: |
          set -euo pipefail
          # Override project to STAGING — never the prod rasaoi ID.
          export VERCEL_ORG_ID="$VERCEL_ORG_ID"
          export VERCEL_PROJECT_ID="$VERCEL_STAGING_PROJECT_ID"

          # Token stays in VERCEL_TOKEN; do not pass --token (it lands in process args).
          url=$(vercel deploy --prod --yes \
            --build-env VITE_SUPABASE_URL="$STAGING_VITE_SUPABASE_URL" \
            --build-env VITE_SUPABASE_PUBLISHABLE_KEY="$STAGING_VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-env VITE_SUPABASE_PROJECT_ID="$STAGING_VITE_SUPABASE_PROJECT_ID" \
            --build-env VITE_USE_MOCK_PLACES=true \
            --build-env VITE_EXPERIMENTAL_DYNAMIC_CULINARY=true \
            --build-env VITE_EXPERIMENTAL_MODEL_ROUTER=true)

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging site" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project URL: https://rasaoi-i8.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- (Optional rename in Vercel → rasaoi-staging.vercel.app)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prod untouched: https://rasaoi-delta.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- No develop merge" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed staging: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          STAGING_VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_VITE_SUPABASE_PROJECT_ID }}
