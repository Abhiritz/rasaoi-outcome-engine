# Deploy dedicated staging site (ROE-016) — NOT rasaoi-delta production
#
# Target: https://rasaoi-staging.vercel.app  (separate Vercel project)
# Triggers: push to experimental/staging branches only.
# Never merges to develop. Never deploys to VERCEL_PROJECT_ID (prod).

name: Deploy staging site

on:
  push:
    branches:
      - feature/ROE-016-experimental-infra
      - staging
  workflow_dispatch:

concurrency:
  group: staging-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    name: Staging quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: test -f .cursor/CONTEXT_PLAN.md
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  deploy-staging:
    name: Deploy rasaoi-staging (Vercel)
    needs: quality
    if: github.repository == 'Abhiritz/rasaoi-outcome-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://rasaoi-staging.vercel.app
    steps:
      - name: Validate secrets
        run: |
          missing=0
          for secret in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_STAGING_PROJECT_ID \
            STAGING_VITE_SUPABASE_URL STAGING_VITE_SUPABASE_PUBLISHABLE_KEY STAGING_VITE_SUPABASE_PROJECT_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              missing=1
            fi
          done
          exit $missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          STAGING_VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to staging project (--prod on rasaoi-staging only)
        id: deploy
        run: |
          set -euo pipefail
          # VERCEL_PROJECT_ID here is the STAGING project — never the prod rasaoi ID.
          export VERCEL_ORG_ID="$VERCEL_ORG_ID"
          export VERCEL_PROJECT_ID="$VERCEL_STAGING_PROJECT_ID"

          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env VITE_SUPABASE_URL="$STAGING_VITE_SUPABASE_URL" \
            --build-env VITE_SUPABASE_PUBLISHABLE_KEY="$STAGING_VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-env VITE_SUPABASE_PROJECT_ID="$STAGING_VITE_SUPABASE_PROJECT_ID" \
            --build-env VITE_USE_MOCK_PLACES=true \
            --build-env VITE_EXPERIMENTAL_DYNAMIC_CULINARY=true \
            --build-env VITE_EXPERIMENTAL_MODEL_ROUTER=true)

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging site" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable URL: https://rasaoi-staging.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prod untouched: https://rasaoi-delta.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- No develop merge" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed staging: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          STAGING_VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_VITE_SUPABASE_PROJECT_ID }}
