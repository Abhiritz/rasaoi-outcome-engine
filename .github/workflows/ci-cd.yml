name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder values for CI build verification only (no real credentials).
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit critical and high advisories
        run: npm run audit:ci

      - name: Audit Apify actor critical and high advisories
        run: |
          npm ci --ignore-scripts --prefix scripts/experimental/apify-rasaoi-menu-sync
          npm audit --audit-level=high --prefix scripts/experimental/apify-rasaoi-menu-sync

      - name: Context plan present
        run: |
          test -f .cursor/CONTEXT_PLAN.md
          echo "CONTEXT_PLAN.md tracked — agents should read it before deep dives."

      - name: Sync-pair twin CI
        run: npm run ci:twins

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Required status check name for branch protection: "Quality gates"
  # Deploy only after merge/push to develop|main (not on pull_request).

  deploy-production:
    name: Deploy production (Vercel)
    needs: quality
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      github.repository == 'Abhiritz/rasaoi-outcome-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://rasaoi-delta.vercel.app
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Deploy safety checks
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "::error::Production deploy is push-only"
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/develop) ;;
            *)
              echo "::error::Refusing production deploy from ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if [ "${GITHUB_REPOSITORY}" != "Abhiritz/rasaoi-outcome-engine" ]; then
            echo "::error::Refusing deploy from ${GITHUB_REPOSITORY}"
            exit 1
          fi
          missing=0
          for secret in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_STAGING_PROJECT_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              missing=1
            fi
          done
          if [ "${VERCEL_PROJECT_ID}" = "${VERCEL_STAGING_PROJECT_ID}" ]; then
            echo "::error::VERCEL_PROJECT_ID must not equal VERCEL_STAGING_PROJECT_ID"
            missing=1
          fi
          if [ "${VERCEL_PROJECT_ID}" = "aotlzhdgnvovvqxmgyyx" ] || [ "${VERCEL_PROJECT_ID}" = "kiugplotjcnmpwjlxajc" ]; then
            echo "::error::Refusing a Supabase project ref as the Vercel project id"
            missing=1
          fi
          exit "$missing"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-check critical and high advisories
        run: npm run audit:ci

      - name: Install Vercel CLI
        run: npm install -g vercel@66.5.0

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          set -euo pipefail
          # Token stays in VERCEL_TOKEN; do not pass --token (it lands in process args).
          url=$(vercel deploy --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
