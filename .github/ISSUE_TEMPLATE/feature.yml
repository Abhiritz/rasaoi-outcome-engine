name: Feature / enhancement
description: New capability or product improvement
title: "[ROE-NNN] "
labels: ["type:feature"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — blocker
        - P1 — high
        - P2 — medium
        - P3 — low / polish
      default: 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ask
        - Reading
        - Lab
        - Catalog
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: What should diners or operators see when this ships?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
    validations:
      required: true
